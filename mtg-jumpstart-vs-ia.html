function aiTg(c,i=1){const A=G.p[i],H=G.p[1-i];

 if(f.k=='dmg')return cr.find(x=>f.n>=th(x)-x.dmg&&!has(x,'indestructible')&&val(x)>=3)||(f.tg=='any'&&H.life<=f.n?H:false);

  for(const c of sub){const p=plan(A,c);if(!p||aiTg(c,i)===false){ok=false;break}p.forEach(l=>{l.tapped=1;tp.push(l)});sc+=c.cmc+(c.cr?1.5:0)+(isSp(c)?1:0)+(c.eqp?.5:0)}
  tp.forEach(l=>l.tapped=0);if(ok&&sc>bs){bs=sc;best=sub}}return best}

 else if(m=='block')G.done();else if(m=='prio')G.pdone();else if(m=='target'){const r=G.pend.res;G.mode=G.prev;G.pend=null;if(r){G.busy=1;r(null)}render()}};

function fire(t){const c=G.pend;if(c.res){G.mode=G.prev;G.pend=null;G.busy=1;c.res(t);return}G.busy=1;G.mode=G.prev;G.pend=null;(c.eqp&&alive(c)?equip(G.p[0],c,t):cast(G.p[0],c,t)).then(()=>{G.busy=0;render()})}
$('#aiLife').onclick=()=>tgtP()&&fire(G.p[1]);$('#myLife').onclick=()=>tgtP()&&fire(G.p[0]);
document.addEventListener('click',e=>{const x=e.target.closest('.card[data-i]');if(!x||!G||G.busy&&G.mode!='block'||G.over)return;const c=reg[x.dataset.i],me=G.p[0],m=G.mode,mine=me.bf.includes(c);
 if(m=='bottom'){if(me.hand.includes(c)){me.hand.splice(me.hand.indexOf(c),1);me.lib.unshift(c);if(!--G.nb)G.bdone();render()}return}if(m=='discard'){if(me.hand.includes(c)){me.hand.splice(me.hand.indexOf(c),1);me.gy.push(c);log('Descartas '+c.pname);if(!--G.nd)G.ddone();render()}return}if(m=='target'){if(tgtC(c))fire(c);return}
 if((m=='main1'||m=='main2'||m=='prio')&&me.hand.includes(c)){
  if(c.ld){if(m!='prio'&&!me.landPlayed){me.landPlayed=1;me.hand.splice(me.hand.indexOf(c),1);me.bf.push(c);log('Juegas '+c.pname);render()}return}
  if(m=='prio'&&G.only){if(inst_(me,c)){G.cs=c;G.pdone()}else log('Elige un contrahechizo que puedas pagar.');return}
  if(m=='prio'&&!inst_(me,c)){log('Ahora solo puedes lanzar instantáneos o criaturas con destello.');return}
  if(c.fx&&c.fx.k=='ctrs'){log('Los contrahechizos se lanzan en respuesta a un hechizo rival.');return}
  if(!plan(me,c)){log('No tienes maná suficiente para '+c.pname);return}
  if((isSp(c)&&c.fx&&/^(dmg|destroy|pump|pac|ctr)$/.test(c.fx.k))||(c.eqp&&c.eqp.aura)){G.prev=m;G.mode='target';G.pend=c;render();return}
  G.busy=1;cast(me,c).then(()=>{G.busy=0;render()});return}
 if((m=='main1'||m=='main2')&&mine&&c.eqp&&!c.eqp.aura&&c.eqp.cost){if(plan(me,{cost:c.eqp.cost})){G.prev=m;G.mode='target';G.pend=c;render()}else log('No tienes maná para equipar '+c.pname);return}
 if((m=='main1'||m=='main2'||m=='prio')&&mine&&c.abil){const ok=c.abil.filter(a=>canAct(me,c,a));if(!ok.length){log('No puedes activar '+c.pname+' ahora.');return}const k=ok.length>1?pick('Habilidad de '+c.pname+':',ok.map(a=>a.txt)):0;if(k==null)return;G.busy=1;activate(me,c,ok[k]).then(()=>{G.busy=0;render()});return}
 if(m=='atk'&&mine&&c.cr&&!c.tapped&&!c.sick&&!c.pac&&!has(c,'defender')){c.sel=!c.sel;render();return}
 if(m=='block'){if(mine&&c.cr&&!c.tapped&&!c.pac){if(c.blk){c.blk=0;for(const l of G.bm.values()){const i=l.indexOf(c);if(i>=0)l.splice(i,1)}}else{if(G.sb)G.sb.sel=0;G.sb=c;c.sel=1}render()}
  else if(G.att.includes(c)&&G.sb&&can(G.sb,c)){const l=G.bm.get(c.id)||[];l.push(G.sb);G.bm.set(c.id,l);G.sb.blk=1;G.sb.bn=c.bn;G.sb.sel=0;G.sb=null;render()}}});
async function mull(){const me=G.p[0],A=G.p[1];let n=0;
 for(;;){render();G.mode='mull';G.busy=0;ui();const keep=await new Promise(r=>G.mres=r);if(keep||n>=4)break;n++;me.lib.push(...me.hand.splice(0));me.lib=R(me.lib);draw(me,7);log('Mulligan '+n)}
 if(n){G.mode='bottom';G.nb=n;G.busy=0;render();await new Promise(r=>G.bdone=r)}
 let k=0;const bad=()=>{const l=A.hand.filter(c=>c.ld).length;return l<2||l>5};
 while(bad()&&k<2){k++;A.lib.push(...A.hand.splice(0));A.lib=R(A.lib);draw(A,7)}
 if(k){log(`La IA hace mulligan (${k}).`);for(let i=0;i<k;i++){const h=A.hand,ls=h.filter(c=>c.ld),c=ls.length>3?ls[0]:[...h].sort((a,b)=>b.cmc-a.cmc)[0];h.splice(h.indexOf(c),1);A.lib.unshift(c)}}
 G.mode='wait'}
function restart(){try{sessionStorage.cfg=JSON.stringify(picked)}catch(e){}location.reload()}
function autoStart(){try{const c=JSON.parse(sessionStorage.cfg||'null');sessionStorage.removeItem('cfg');if(c&&c.length==2){picked=c;$('#play').disabled=false;$('#play').click()}}catch(e){}}
$('#rst').onclick=()=>confirm('¿Reiniciar la partida con tus mismos paquetes?')&&restart();
$('#menuB').onclick=()=>confirm('¿Volver a la selección de paquetes?')&&location.reload();
$('#auto').onclick=async()=>{if(!G||G.over)return;G.auto=!G.auto;$('#auto').textContent='Piloto: '+(G.auto?'SÍ':'NO');
 if(G.auto&&G.t==0&&!G.busy&&['main1','main2','atk'].includes(G.mode)){G.p[0].bf.forEach(c=>c.sel=0);G.mode='ai';await aiTurn(0);if(!G.over){G.mode='ai';G.next()}}};
document.addEventListener('keydown',e=>{if(!G||G.busy&&G.mode!='block')return;const b=e.code=='Space'?$('#go'):e.key=='e'?$('#end'):0;if(b&&b.style.display!='none'){e.preventDefault();b.click()}});
function inst_(P,c){if(G.only)return !!(c.fx&&c.fx.k==G.only&&plan(P,c));return !c.ld&&!!plan(P,c)&&!(isSp(c)&&!c.fx)&&!(c.fx&&c.fx.k=='ctrs')&&(/Instant/.test(c.type)||has(c,'flash'))}
async function prio(txt){const me=G.p[0],can=me.hand.some(c=>inst_(me,c))||(!G.only&&me.bf.some(c=>c.abil&&c.abil.some(a=>canAct(me,c,a))));if(G.auto||G.over||!can)return;const pm=G.mode,pb=G.busy;G.mode='prio';G.pm=txt;G.busy=0;render();await new Promise(r=>G.pdone=r);G.mode=pm;G.busy=pb;render()}
async function discard(P){if(P.hand.length<=7)return;
 if(P===G.p[0]&&!G.auto){G.mode='discard';G.nd=P.hand.length-7;G.busy=0;render();await new Promise(r=>G.ddone=r);G.mode='ai';G.busy=1;return}
 while(P.hand.length>7){const h=P.hand,ls=h.filter(c=>c.ld),c=ls.length>3?ls[0]:[...h].sort((a,b)=>b.cmc-a.cmc)[0];h.splice(h.indexOf(c),1);P.gy.push(c);log((P===G.p[0]?'Descartas ':'La IA descarta ')+c.pname)}}
function showGy(i){const v=$('#gyv'),h=document.createElement('div');h.style.cssText='width:100%;font-size:18px';h.textContent=`${i?'Cementerio de la IA':'Tu cementerio'} (${G.p[i].gy.length}) · clic para cerrar`;v.replaceChildren(h,...G.p[i].gy.map(c=>cardEl(c,1)));v.classList.add('on')}
$('#gyv').onclick=()=>$('#gyv').classList.remove('on');$('#myMeta').onclick=()=>G&&showGy(0);$('#aiMeta').onclick=()=>G&&showGy(1);
loadAll();
